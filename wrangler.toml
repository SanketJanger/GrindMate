name = "grindmate"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Workers AI binding (Llama 3.3)
[ai]
binding = "AI"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "grindmate-db"
database_id = "73c2b669-abfc-4861-8668-ce96c2c4eecf"

# Durable Objects (Agent state)
[durable_objects]
bindings = [
  { name = "GRINDMATE_AGENT", class_name = "GrindMateAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrindMateAgent"]

# Daily review-reminder email cron. Fires at both 13:00 and 14:00 UTC
# because 9:00 AM US Eastern lands on a different UTC hour depending on
# DST (EDT = UTC-4, EST = UTC-5); the scheduled handler checks the actual
# Eastern clock and only sends on the trigger that's really 9:00 AM ET.
[triggers]
crons = ["0 13 * * *", "0 14 * * *"]

# Serve React frontend from the same origin as the worker
[assets]
directory = "./frontend/dist"
run_worker_first = false

# Environment variables
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://grindmate.dev"
# INGEST_API_KEY (auth for the usage-analytics-api Cloud Run /ingest
# endpoint) is a secret, not a var — set it with:
#   wrangler secret put INGEST_API_KEY
